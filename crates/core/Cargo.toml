[package]
name = "devagotchi-core"
description = "The Devagotchi broker: admission, operation lifecycle, SQLite journal, output retention, and native process supervision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
devagotchi-contracts = { workspace = true }
devagotchi-ipc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The broker, journal, and execution lifecycle build where a native execution
# provider exists.
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
base64 = { workspace = true }
dunce = { workspace = true }
hex = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
devagotchi-ipc = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
