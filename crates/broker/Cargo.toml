[package]
name = "devagotchi-broker"
description = "The independently running per-user Devagotchi broker (`devagotchi start`, `devagotchi broker run`)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# The binary keeps its historical name until the rename decision lands.
[lib]
name = "devagotchi_broker"
path = "src/lib.rs"

[dependencies]
devagotchi-contracts = { workspace = true }
devagotchi-core = { workspace = true }
devagotchi-ipc = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
