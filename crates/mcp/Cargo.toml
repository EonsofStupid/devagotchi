[package]
name = "devagotchi-mcp"
description = "Thin stdio MCP adapter (official rmcp SDK) that maps typed tools onto the broker's local IPC (`devagotchi mcp`); this crate never links the broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# The binary keeps its historical name until the rename decision lands.
[lib]
name = "devagotchi_mcp"
path = "src/lib.rs"

[dependencies]
base64 = { workspace = true }
devagotchi-contracts = { workspace = true }
devagotchi-ipc = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
