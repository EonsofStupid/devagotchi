[package]
name = "devagotchi"
description = "The one Devagotchi binary: start the broker, serve MCP, work the board, run the link or the hub — one organized command tree over the same libraries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "devagotchi"
path = "src/main.rs"

[dependencies]
devagotchi-broker = { path = "../broker" }
devagotchi-hub = { path = "../hub" }
devagotchi-link = { path = "../link" }
devagotchi-mcp = { path = "../mcp" }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[package.metadata.dist]
dist = true
