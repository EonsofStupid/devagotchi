[package]
name = "devagotchi-ipc"
description = "Private per-user local IPC: framing, the typed client, and the native Unix-socket and named-pipe endpoints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Test helpers shared with dependent crates' test suites. Never enabled in a shipped build.
test-support = []

[dependencies]
devagotchi-contracts = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The named pipe is addressed by a SHA-256 of the canonical state path and the owner SID.
dunce = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
windows-sys = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
