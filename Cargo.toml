[workspace]
resolver = "3"
members = [
    "crates/contracts",
    "crates/ipc",
    "crates/core",
    "crates/broker",
    "crates/mcp",
    "crates/hub",
    "crates/link",
    "crates/devagotchi",
    "apps/desktop/src-tauri",
]
# `cargo build` / `cargo test` at the root build the broker, adapter and their
# libraries. The Tauri inspector needs native webview toolchains, so it is a
# member (one lockfile, one toolchain) but built explicitly with `-p`.
default-members = [
    "crates/contracts",
    "crates/ipc",
    "crates/core",
    "crates/broker",
    "crates/mcp",
    "crates/hub",
    "crates/link",
    "crates/devagotchi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# rmcp 3.5.1 sets the floor; the pinned toolchain in rust-toolchain.toml is what builds.
rust-version = "1.88"
publish = false
license = "Apache-2.0"
repository = "https://github.com/EonsofStupid/devagotchi"

[workspace.dependencies]
devagotchi-contracts = { path = "crates/contracts" }
devagotchi-ipc = { path = "crates/ipc" }
devagotchi-core = { path = "crates/core" }

rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "net", "sync", "signal", "time"] }
libc = "0.2"
base64 = "0.22.1"
dunce = "1.0.5"
hex = "0.4.3"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10.9"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

# The profile that 'dist' will build with. Fat LTO and one codegen unit let the
# optimizer see the whole program (smaller, faster binaries at a slower build);
# symbols are stripped because a release binary is debugged from its journal, not
# a debugger, and the attested archive is what ships.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
