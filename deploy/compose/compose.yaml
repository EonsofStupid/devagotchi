# A self-hosted Devagotchi hub: the hub, its own Postgres, and Caddy for TLS.
#   cp .env.example .env   # set DEVAGOTCHI_DOMAIN
#   docker compose up -d
# README.md beside this file says what each part does and how to change it.
name: devagotchi

services:
  postgres:
    image: ${DEVAGOTCHI_POSTGRES_IMAGE:-postgres:18-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8}
    # No network at all: Postgres listens on a Unix socket only, in a volume shared with
    # the hub alone. Nothing can reach it over TCP, so there is no password to keep.
    network_mode: none
    environment:
      POSTGRES_USER: devagotchi
      POSTGRES_DB: devagotchi
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: --data-checksums
    command:
      - postgres
      - -c
      - listen_addresses=
      - -c
      - unix_socket_directories=/var/run/postgresql
      - -c
      - shared_buffers=${DEVAGOTCHI_PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${DEVAGOTCHI_PG_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - max_connections=${DEVAGOTCHI_PG_MAX_CONNECTIONS:-50}
      - -c
      - wal_compression=on
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=${DEVAGOTCHI_PG_SLOW_MS:-500}
    volumes:
      - postgres-data:/var/lib/postgresql
      - postgres-socket:/var/run/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "/var/run/postgresql", "-U", "devagotchi", "-d", "devagotchi"]
      interval: 5s
      timeout: 5s
      retries: 30
    shm_size: 128mb
    restart: unless-stopped

  hub:
    image: ${DEVAGOTCHI_IMAGE:-ghcr.io/eonsofstupid/devagotchi:main}
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    configs:
      - source: hub
        target: /etc/devagotchi/hub.json
    volumes:
      - hub-state:/var/lib/devagotchi
      - postgres-socket:/var/run/postgresql
    # Runs as nonroot in an image with nothing else in it, so the only place it can write
    # is its state volume. (Not `read_only`: Compose writes the config below into the
    # container, which a read-only one refuses.)
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  caddy:
    image: ${DEVAGOTCHI_CADDY_IMAGE:-caddy:2@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e}
    depends_on: [hub]
    command: ["caddy", "reverse-proxy", "--from", "${DEVAGOTCHI_DOMAIN:?set DEVAGOTCHI_DOMAIN in .env}", "--to", "hub:8787"]
    ports:
      - "${DEVAGOTCHI_HTTP_PORT:-80}:80"
      - "${DEVAGOTCHI_HTTPS_PORT:-443}:443"
      - "${DEVAGOTCHI_HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

configs:
  hub:
    # The hub's config (crates/hub/README.md). Its own accounts and passkeys; its store is
    # the Postgres above, over the shared socket.
    content: |
      {
        "listen": "0.0.0.0:8787",
        "public_url": "${DEVAGOTCHI_PUBLIC_URL:-https://${DEVAGOTCHI_DOMAIN:?set DEVAGOTCHI_DOMAIN in .env}}",
        "auth": { "mode": "hub" },
        "storage": { "url": "postgres://devagotchi@localhost/devagotchi?host=/var/run/postgresql" },
        "brokers": [],
        "grants": []
      }

volumes:
  postgres-data:
  postgres-socket:
  hub-state:
  caddy-data:
  caddy-config:
