[package]
name = "devagotchi-desktop"
description = "Devagotchi local desktop inspector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "devagotchi_desktop"
path = "src/lib.rs"

[[bin]]
name = "devagotchi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
# The inspector links only the contracts and the typed client, never the broker.
devagotchi-contracts = { workspace = true }
devagotchi-ipc = { workspace = true }
serde = { workspace = true }
tauri = { version = "=2.12.4", features = [] }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[features]
custom-protocol = ["tauri/custom-protocol"]
