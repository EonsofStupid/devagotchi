[package]
name = "devagotchi-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "Devagotchi local desktop inspector"

[workspace]

[lib]
name = "devagotchi_desktop"
path = "src/lib.rs"

[[bin]]
name = "devagotchi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
desktop-bridge = { path = "../../.." }
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.12.4", features = [] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
