# The release gate, run by release.yml once dist's builds are done: on a fresh runner of each
# kind, the README's own install line, run from every shell there, installs Devagotchi from
# this run's own installers and archives (the very files `host` publishes, served on
# 127.0.0.1); its `devagotchi setup` sets up Claude Code, Codex and Claude Desktop; a failed
# download stops the line before setup; and after the broker is killed as a reboot would, the
# command Codex was given starts it again and runs a job (tests/install_check.py). `host`
# publishes a release only when every runner passed; pull requests and main run it too.
name: install-check

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  targets:
    # Every target dist builds has a runner below; a new one (macOS is next) fails here until
    # it gets one.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every built target is tested
        env:
          PLAN: ${{ inputs.plan }}
        shell: python3 {0}
        run: |
          import json, os, sys
          tested = {"x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
                    "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"}
          matrix = json.loads(os.environ["PLAN"])["ci"]["github"]["artifacts_matrix"]["include"]
          built = {t for entry in matrix for t in entry["targets"]}
          print("built:", sorted(built))
          if not built or built - tested:
              sys.exit(f"no install-check runner for {sorted(built - tested)}")

  install:
    name: install (${{ matrix.os }})
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        # 22.04 (x86_64 and ARM64) has the oldest glibc the archives are built for (2.35);
        # windows-2022 has the pre-24H2 console. The harness checks the archive each shell
        # fetched: this system's own, except x64 from Git Bash on ARM64 Windows.
        os: [ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04, ubuntu-24.04-arm, windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      # Every archive and both installers, as the release has them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-*
          path: served
          merge-multiple: true
      - run: python tests/install_check.py --served served
