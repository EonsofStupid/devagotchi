name: image

# The hub image (deploy/compose/Dockerfile) on GHCR, so `docker compose up` pulls it instead of
# building, and so every hub from it hands out builds with nothing configured. release.yml
# calls this once dist has built every target (`custom-hub-image`), so the image carries those
# very archives: the Linux and Windows builds of the same commit, x86_64 and ARM64, with both
# installers, laid down by scripts/stage-downloads.sh and passed between jobs as an artifact.
# Each arch is built natively, brought up as a hosted compose stack with no downloads
# configured, and a machine joins it the way a person's AI tells them to (tests/compose_join.py).
# Then, for main and release tags only: one multi-arch tag set with a signed build-provenance
# attestation. Tags: `main` and `sha-<short>` for every main build; the version and `latest` for
# a release tag. The registry path comes from the repository's owner; nothing is named here.
on:
  workflow_call:
    inputs:
      plan:
        description: dist's plan (release.yml `plan`), for a release's version
        required: true
        type: string

permissions:
  contents: read

jobs:
  downloads:
    name: downloads
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # What joining machines install into versions/<VERSION>: a release's own version, else
      # main-<short> (as scripts/lay-down-dist.sh names a main build), else ci-<short>.
      - name: Version
        id: version
        env:
          PLAN: ${{ inputs.plan }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          case $REF in
            refs/tags/*) version=$(jq -r '.releases[0].app_version // empty' <<<"$PLAN") ;;
            refs/heads/main) version="main-${SHA::7}" ;;
            *) version="ci-${SHA::7}" ;;
          esac
          [ -n "$version" ] || { echo "no version in dist's plan" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-local-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Lay down the builds
        run: scripts/stage-downloads.sh "$RUNNER_TEMP/dist" "$VERSION" "$RUNNER_TEMP/downloads"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hub-downloads
          path: ${{ runner.temp }}/downloads/
          if-no-files-found: error
          retention-days: 1

  build:
    name: build (${{ matrix.platform }})
    needs: downloads
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devagotchi" >> "$GITHUB_ENV"
          echo "ARCH=${PLATFORM#linux/}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hub-downloads
          path: ${{ runner.temp }}/downloads
      # Readable by the hub's nonroot user in the image, writable by nobody.
      - run: chmod -R a+rX,go-w "$RUNNER_TEMP/downloads"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image to test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/compose/Dockerfile
          platforms: ${{ matrix.platform }}
          build-contexts: downloads=${{ runner.temp }}/downloads
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: devagotchi-hub:ci
          load: true
          cache-from: type=gha,scope=image-${{ env.ARCH }}
          cache-to: type=gha,scope=image-${{ env.ARCH }},mode=max
      # A hosted hub as app.devagotchi.com runs, at http://localhost so nothing needs TLS. No
      # `downloads` in its config or its environment: it serves the builds the image carries.
      - name: Bring the stack up from it
        working-directory: deploy/compose
        run: |
          printf '%s\n' DEVAGOTCHI_DOMAIN=localhost DEVAGOTCHI_HTTP_PORT=8080 \
            DEVAGOTCHI_HTTPS_PORT=8443 DEVAGOTCHI_PUBLIC_URL=http://localhost:8787 \
            DEVAGOTCHI_HUB_TENANCY=multi DEVAGOTCHI_IMAGE=devagotchi-hub:ci > .env
          docker compose up -d --no-build --wait --wait-timeout 180
          env=$(docker inspect --format '{{json .Config.Env}}' "$(docker compose ps -q hub)")
          if grep -q DOWNLOADS <<<"$env"; then echo "the hub's environment names downloads: $env" >&2; exit 1; fi
          if docker compose config | grep -q '"downloads"'; then echo "the hub's config names downloads" >&2; exit 1; fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: A machine joins with the line an AI hands over
        run: python tests/compose_join.py --hub http://localhost:8787 --version "$VERSION"
        env:
          VERSION: ${{ needs.downloads.outputs.version }}
      - name: Logs
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color --tail 200 || true
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same build again, from the builder's cache: the image just tested, pushed.
      - name: Push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/compose/Dockerfile
          platforms: ${{ matrix.platform }}
          build-contexts: downloads=${{ runner.temp }}/downloads
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ env.ARCH }}
      - name: Keep the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ env.ARCH }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # One publish at a time for a ref, in order, none cancelled.
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devagotchi" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: One multi-arch tag set
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Digest
        id: digest
        run: |
          tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$tag"
          echo "digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
