name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Each native execution provider runs its lifecycle tests on its own OS.
        # windows-2022 keeps the pre-24H2 console path; windows-2025 (build 26100)
        # has ReleasePseudoConsole. macOS has no provider yet: the contracts, the
        # IPC crate and the adapter build and test there, and the broker binary
        # reports unsupported_platform.
        os: [ubuntu-24.04, windows-2025, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Default members: contracts, ipc, core, broker, mcp, hub. The Tauri inspector
      # is a workspace member but needs native webview toolchains; it gets its
      # own job when it enters CI.
      - run: cargo build --locked --bins
      # nextest runs every test binary (library, binary and integration tests),
      # one process per test, with the profile in .config/nextest.toml.
      - run: cargo nextest run --locked --profile ci

  e2e:
    # The built binaries, end to end: broker, stdio adapter, hub over HTTP MCP.
    # Unix socket on Linux, named pipe on Windows; same probes (tests/e2e.py).
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: cargo build --locked --bins
      - run: python tests/e2e.py --bin-dir target/debug
      # The Windows installer, as a user would run it: install from the build, start the
      # broker, register with a Claude Desktop config that already has Desktop Commander,
      # then use exactly the registered command. PowerShell 7 on 2025, 5.1 on 2022.
      - name: Windows installer (PowerShell 7)
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: ./deploy/windows/ci-install-check.ps1
      - name: Windows installer (Windows PowerShell 5.1)
        if: matrix.os == 'windows-2022'
        shell: powershell
        run: ./deploy/windows/ci-install-check.ps1
