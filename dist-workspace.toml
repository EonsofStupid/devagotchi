[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Signed provenance for every artifact (GitHub artifact attestations)
github-attestations = true

# Build each released package on its own (the Tauri desktop crate needs GTK and is not released here)
precise-builds = true

# Build and upload the artifacts on pull requests too, so the Windows release build is proven before merge
pr-run-mode = "upload"

# release.yml is generated by dist, which refuses to run when the file differs from what it
# would write. Dependabot bumps the actions in it like in any workflow (devagotchi #23 failed
# the plan job for exactly that), so the CI file may differ; `dist generate` still refreshes it.
allow-dirty = ["ci"]
